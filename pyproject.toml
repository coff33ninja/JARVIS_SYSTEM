[project]
name = "jarvis-system"
version = "0.1.0"
description = "Local-first Iron Man/JARVIS-style gesture + LLM computer control system (MediaPipe + HUD + agent + throw/catch transfer)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Vision / ML
    "mediapipe>=0.10.14",
    "opencv-python>=4.8",
    "numpy>=1.24",
    # Desktop control
    "pyautogui>=0.9.54",
    "pynput>=1.7.6",
    "pywin32>=306; platform_system == 'Windows'",
    # HUD / networking
    "websockets>=12.0",
    "requests>=2.31",
    "PyYAML>=6.0",
    # Voice / agent (Phase 3)
    "faster-whisper>=1.0",
    "openai>=1.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "black>=26.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Deliberate patterns used across the codebase (see docs/06_DECISIONS.md):
ignore = [
    "BLE001",  # broad `except Exception` fallbacks that never crash the loop
    "S110",    # silent try/except:pass for optional-feature fallbacks
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "scripts"]

[tool.black]
line-length = 88

[tool.bandit]
# False positives / deliberate patterns (see docs/06_DECISIONS.md):
#   B101 - assert in tests (pytest idiom) and type-narrowing asserts in code
#   B311 - random in tests (test-data generation, not security)
#   B110 - silent try/except:pass for optional-feature fallbacks
#   B310 - urlopen only against trusted/local endpoints (Ollama base_url,
#          fixed model URL, localhost test servers)
#   B404 - subprocess module usage is intentional in the control/agent layers
#   B603 - subprocess calls pass only static literals or config values
#   B606 - informational: processes launched without a shell (by design)
#   B607 - system utilities resolved through PATH (tasklist/taskkill/osk)
#   B608 - SQL f-strings interpolate only whitelist-validated table/col names
skips = [
    "B101",
    "B110",
    "B310",
    "B311",
    "B404",
    "B603",
    "B606",
    "B607",
    "B608",
]

[tool.uv]
# This is an application, not a distributable package.
package = false
# Use a uv-managed Python (bypasses system Python restrictions/versions).
managed = true
python-preference = "managed"
# Keep the cache off the system drive (C:) — bypass system cache restrictions.
cache-dir = "D:/uv-cache"
