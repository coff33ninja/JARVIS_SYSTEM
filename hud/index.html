<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JARVIS HUD</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden;
               font-family: "Segoe UI", system-ui, sans-serif; }
  #hud { position: fixed; inset: 0; }
  #status { position: fixed; left: 16px; top: 12px; color: #6ee7ff;
            font-size: 14px; text-shadow: 0 0 6px rgba(110,231,255,.6);
            z-index: 2; user-select: none; line-height: 1.5; }
  #status .gesture { font-size: 18px; font-weight: 600; }
  #status .meta { opacity: .8; font-size: 12px; }
  #map { position: fixed; right: 16px; top: 12px; z-index: 2; opacity: .85;
         pointer-events: none; }
  #retX { position: fixed; left: 50%; top: 50%; width: 0; height: 0; z-index: 1;
          pointer-events: none; }
  .line { position: absolute; background: rgba(110,231,255,.85);
          box-shadow: 0 0 8px rgba(110,231,255,.8); }
  .hl  { width: 34px; height: 2px; transform: translate(-50%,-50%); }
  .vl  { width: 2px; height: 34px; transform: translate(-50%,-50%); }
  #retMon { position: absolute; left: 0; top: 22px; transform: translateX(-50%);
            color: #6ee7ff; font-size: 11px; text-align: center;
            text-shadow: 0 0 4px rgba(110,231,255,.8); width: 40px; }
  #skeleton { position: fixed; inset: 0; z-index: 0; opacity: .9; }
  #menu { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  #mapCanvas { background: rgba(0,0,0,.25); border: 1px solid rgba(110,231,255,.3);
               border-radius: 4px; }
  #calib { position: fixed; right: 16px; bottom: 12px; z-index: 2; opacity: .6;
           color: #6ee7ff; font-size: 11px; text-decoration: none; }
  #menu-notice { position: fixed; left: 50%; bottom: 12%; transform: translateX(-50%);
           z-index: 3; color: #e9fbff; font-size: 15px; font-weight: 600;
           background: rgba(0,0,0,.55); border: 1px solid rgba(110,231,255,.5);
           border-radius: 6px; padding: 8px 18px; text-shadow: 0 0 6px rgba(110,231,255,.5);
           opacity: 0; transition: opacity .25s ease; pointer-events: none; }
  #menu-notice.show { opacity: 1; }
</style>
</head>
<body>
  <div id="status">JARVIS HUD — waiting for connection…</div>
  <div id="map"><canvas id="mapCanvas" width="200" height="120"></canvas></div>
  <div id="retX"><div class="line hl"></div><div class="line vl"></div>
    <div id="retMon"></div></div>
  <canvas id="skeleton"></canvas>
  <canvas id="menu"></canvas>
  <div id="menu-notice"></div>
  <a id="calib" href="http://127.0.0.1:8766/" target="_blank">calibrate</a>
<script>
(function () {
  const status = document.getElementById('status');
  const ret = document.getElementById('retX');
  const retMon = document.getElementById('retMon');
  const canvas = document.getElementById('skeleton');
  const ctx = canvas.getContext('2d');
  const menuCanvas = document.getElementById('menu');
  const menuCtx = menuCanvas.getContext('2d');
  const mapC = document.getElementById('mapCanvas');
  const mctx = mapC.getContext('2d');
  let monitors = [];

  function sizeCanvas() {
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    menuCanvas.width = window.innerWidth * devicePixelRatio;
    menuCanvas.height = window.innerHeight * devicePixelRatio;
    menuCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  sizeCanvas();
  window.addEventListener('resize', sizeCanvas);

  // Virtual-desktop union, used to normalise monitor rects into map space.
  function union() {
    if (!monitors.length) return null;
    const xs = monitors.map(m => m[0]), ys = monitors.map(m => m[1]);
    const x2 = monitors.map(m => m[0] + m[2]), y2 = monitors.map(m => m[1] + m[3]);
    return { left: Math.min(...xs), top: Math.min(...ys),
             right: Math.max(...x2), bottom: Math.max(...y2) };
  }

  function drawMap(active) {
    const u = union();
    const W = mapC.width, H = mapC.height;
    mctx.clearRect(0, 0, W, H);
    if (!u) return;
    const pad = 6, iw = W - pad * 2, ih = H - pad * 2;
    const scale = Math.min(iw / (u.right - u.left), ih / (u.bottom - u.top));
    monitors.forEach((m, i) => {
      const x = pad + (m[0] - u.left) * scale;
      const y = pad + (m[1] - u.top) * scale;
      const w = Math.max(m[2] * scale, 8), h = Math.max(m[3] * scale, 8);
      mctx.fillStyle = i === active ? 'rgba(110,231,255,.45)'
                                    : 'rgba(110,231,255,.12)';
      mctx.fillRect(x, y, w, h);
      mctx.strokeStyle = 'rgba(110,231,255,.8)';
      mctx.lineWidth = 1;
      mctx.strokeRect(x, y, w, h);
      mctx.fillStyle = '#d9fbff';
      mctx.font = '10px Segoe UI, sans-serif';
      mctx.fillText('M' + i, x + 3, y + 11);
    });
  }

  const CONN = {0: 'wrist', 1: 'thumb_cmc', 2: 'thumb_mcp', 3: 'thumb_ip',
    4: 'thumb_tip', 5: 'index_mcp', 6: 'index_pip', 7: 'index_dip',
    8: 'index_tip', 9: 'middle_mcp', 10: 'middle_pip', 11: 'middle_dip',
    12: 'middle_tip', 13: 'ring_mcp', 14: 'ring_pip', 15: 'ring_dip',
    16: 'ring_tip', 17: 'pinky_mcp', 18: 'pinky_pip', 19: 'pinky_dip',
    20: 'pinky_tip'};
  const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],
    [9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],
    [17,18],[18,19],[19,20],[0,17]];

  function drawSkeleton(hands) {
    const w = window.innerWidth, h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(110,231,255,.55)';
    ctx.lineWidth = 2;
    ctx.fillStyle = 'rgba(110,231,255,.95)';
    for (const lm of hands) {
      for (const [a, b] of BONES) {
        ctx.beginPath();
        ctx.moveTo(lm[a][0]*w, lm[a][1]*h);
        ctx.lineTo(lm[b][0]*w, lm[b][1]*h);
        ctx.stroke();
      }
      for (const p of lm) {
        ctx.beginPath();
        ctx.arc(p[0]*w, p[1]*h, 3, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }

  const GESTURE_NAMES = {point: 'POINT', pinch: 'CLICK', two_finger_pinch: 'RIGHT-CLICK',
    fist: 'DRAG', v_sign: 'SCROLL', thumbs_up: 'OK', thumbs_down: 'CANCEL',
    open_palm: 'OPEN', none: ''};
  const MODE_COLORS = {idle: '#8a8a8a', control: '#6ee7ff', chat: '#ffd166',
    transfer: '#8ce99a', presentation: '#ff8fa3'};

  // Radial menu (04_GESTURE_VOCABULARY fist menu). Two layers: category pie,
  // then leaf items inside the highlighted category. Highlight follows the
  // reticle; the backend sends category/item ids on every change.
  const ACCENT = '110,231,255';
  let menuData = null;

  function pieSector(cx, cy, r0, r1, a0, a1) {
    menuCtx.beginPath();
    menuCtx.arc(cx, cy, r1, a0, a1);
    if (r0 > 0) {
      menuCtx.arc(cx, cy, r0, a1, a0, true);
      menuCtx.closePath();
    } else {
      menuCtx.lineTo(cx, cy);
      menuCtx.closePath();
    }
  }

  function drawMenu() {
    const w = window.innerWidth, h = window.innerHeight;
    menuCtx.clearRect(0, 0, w, h);
    if (!menuData || menuData.state !== 'open') return;
    const cats = menuData.categories || [];
    if (!cats.length) return;
    const cx = w / 2, cy = h / 2;
    const R = Math.min(w, h) * 0.34;
    const rItem = R * 0.56;   // inner edge of the category ring
    const submenu = !!menuData.submenu;
    const n = submenu ? 0 : cats.length;
    const labelR = (R + rItem) / 2;

    // Category ring is hidden while a submenu owns the inner ring.
    for (let i = 0; i < n; i++) {
      const a0 = -Math.PI / 2 + i * 2 * Math.PI / n;
      const a1 = a0 + 2 * Math.PI / n;
      const am = (a0 + a1) / 2;
      const sel = cats[i].id === menuData.category;
      menuCtx.fillStyle = sel ? `rgba(${ACCENT},.28)` : `rgba(${ACCENT},.10)`;
      pieSector(cx, cy, rItem, R, a0, a1);
      menuCtx.fill();
      menuCtx.strokeStyle = `rgba(${ACCENT},.75)`;
      menuCtx.lineWidth = 1.5;
      menuCtx.stroke();
      menuCtx.fillStyle = sel ? '#e9fbff' : '#9fd9e6';
      menuCtx.font = `${sel ? 15 : 13}px "Segoe UI", sans-serif`;
      menuCtx.textAlign = 'center';
      menuCtx.textBaseline = 'middle';
      menuCtx.fillText(cats[i].label,
        cx + Math.cos(am) * labelR, cy + Math.sin(am) * labelR);
    }

    // Leaf items: the active submenu, else the highlighted category.
    // In submenu mode the backend sends one pseudo-category whose items ARE
    // the picker rows (rebind actions / threshold nudges) plus a Back row.
    const items = submenu ? ((cats[0] && cats[0].items) || [])
                          : ((cats.find(c => c.id === menuData.category) || {}).items || []);
    if (items.length > 1) {
      const ring = submenu ? rItem : rItem * 0.92;
      for (let j = 0; j < items.length; j++) {
        const a0 = -Math.PI / 2 + j * 2 * Math.PI / items.length;
        const a1 = a0 + 2 * Math.PI / items.length;
        const am = (a0 + a1) / 2;
        const sel = items[j].id === menuData.item;
        menuCtx.fillStyle = sel ? `rgba(${ACCENT},.40)` : `rgba(${ACCENT},.12)`;
        pieSector(cx, cy, 0, ring, a0, a1);
        menuCtx.fill();
        menuCtx.strokeStyle = `rgba(${ACCENT},.7)`;
        menuCtx.lineWidth = 1;
        menuCtx.stroke();
        menuCtx.fillStyle = sel ? '#ffffff' : '#a8dde8';
        menuCtx.font = `${sel ? 13 : 11}px "Segoe UI", sans-serif`;
        menuCtx.fillText((items[j].checked ? '\u2713 ' : '') + items[j].label,
          cx + Math.cos(am) * ring * 0.46, cy + Math.sin(am) * ring * 0.46);
      }
    }
    menuCtx.fillStyle = `rgba(${ACCENT},.9)`;
    menuCtx.beginPath();
    menuCtx.arc(cx, cy, 6, 0, Math.PI * 2);
    menuCtx.fill();
  }

  let ws = null, reconn = 0;
  let noticeTimer = null;
  function showNotice(text) {
    const el = document.getElementById('menu-notice');
    if (!el) return;
    if (!text) { el.classList.remove('show'); return; }
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(noticeTimer);
    noticeTimer = setTimeout(() => el.classList.remove('show'), 2500);
  }
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}`);
    ws.onopen = () => { status.innerHTML = 'JARVIS HUD — connected'; };
    ws.onclose = () => {
      status.textContent = 'JARVIS HUD — disconnected, reconnecting…';
      setTimeout(connect, Math.min(30000, 500 * (reconn++)));
    };
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'skeleton') drawSkeleton(msg.hands || []);
      else if (msg.type === 'reticle') {
        ret.style.left = msg.x + 'px';
        ret.style.top = msg.y + 'px';
        retMon.textContent = msg.monitor >= 0 ? 'M' + msg.monitor : '';
      } else if (msg.type === 'monitors') {
        monitors = msg.monitors || [];
        drawMap(-1);
      } else if (msg.type === 'menu') {
        menuData = msg;
        showNotice(msg.notice || '');
        drawMenu();
      } else if (msg.type === 'status') {
        const g = GESTURE_NAMES[msg.gesture] || '';
        const gHtml = g ? `<div class="gesture" style="color:${MODE_COLORS[msg.mode] || '#6ee7ff'}">${g}</div>` : '';
        const meta = `${msg.mode.toUpperCase()}` +
          (msg.fps ? ` · ${msg.fps.toFixed(0)} fps` : '') +
          (msg.detected ? ' · hand' : ' · no hand');
        status.innerHTML = gHtml +
          `<div class="meta">${meta}</div>`;
      }
    };
  }
  connect();
})();
</script>
</body>
</html>
